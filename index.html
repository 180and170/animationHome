<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cursor Cat · 表情包</title>
  <style>
    /* ─── Reset & Base ───────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #f5f4fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      overflow-x: hidden;
      gap: 0;
    }

    /* ─── Title ──────────────────────────────────────────── */
    .page-title {
      font-size: 13px;
      letter-spacing: 0.25em;
      color: #c0b8d8;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 28px;
    }

    /* ─── Cat wrapper with float ─────────────────────────── */
    .cat-wrap {
      animation: floatAnim 3.2s ease-in-out infinite;
      will-change: transform;
      cursor: pointer;
      filter: drop-shadow(0 24px 48px rgba(100, 60, 200, 0.14));
      transition: filter 0.4s ease;
    }
    .cat-wrap:hover {
      filter: drop-shadow(0 28px 56px rgba(100, 60, 200, 0.22));
    }
    @keyframes floatAnim {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-14px); }
    }

    /* ─── SVG expression groups ──────────────────────────── */
    .expr-g {
      opacity: 0;
      transition: opacity 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .expr-g.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Chat dots pulse */
    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(1); opacity: 1; }
      40%           { transform: scale(1.25); opacity: 0.9; }
    }
    .dot-pulse-1 { animation: dotPulse 1.4s ease-in-out infinite; }
    .dot-pulse-2 { animation: dotPulse 1.4s ease-in-out 0.22s infinite; }
    .dot-pulse-3 { animation: dotPulse 1.4s ease-in-out 0.44s infinite; }

    /* ZZZ float animation */
    @keyframes zFloat {
      0%   { transform: translate(0, 0) scale(1);   opacity: 0.9; }
      100% { transform: translate(4px, -18px) scale(0.6); opacity: 0; }
    }
    .z1 { animation: zFloat 2.0s ease-out 0.0s infinite; }
    .z2 { animation: zFloat 2.0s ease-out 0.6s infinite; }
    .z3 { animation: zFloat 2.0s ease-out 1.2s infinite; }

    /* Heart beat */
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      30%       { transform: scale(1.18); }
      60%       { transform: scale(0.96); }
    }
    .heart-l { animation: heartBeat 1.1s ease-in-out 0.0s infinite; transform-origin: 115px 153px; }
    .heart-r { animation: heartBeat 1.1s ease-in-out 0.2s infinite; transform-origin: 185px 153px; }

    /* Angry shake */
    @keyframes angryShake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-2px) rotate(-1deg); }
      60%       { transform: translateX(2px)  rotate(1deg);  }
    }
    .g-angry { animation: angryShake 0.5s ease-in-out infinite; transform-origin: 150px 158px; }

    /* ─── Expression selector ────────────────────────────── */
    .expr-bar {
      margin-top: 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 460px;
      padding: 0 16px;
    }

    .expr-btn {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      border: 2px solid transparent;
      background: white;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(80, 40, 160, 0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease,
                  border-color 0.15s ease, background 0.15s ease;
      position: relative;
      outline: none;
    }
    .expr-btn:hover {
      transform: translateY(-3px) scale(1.08);
      box-shadow: 0 8px 24px rgba(80, 40, 160, 0.15);
    }
    .expr-btn.active {
      border-color: #8b5cf6;
      background: #f3edff;
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.22);
    }

    /* ─── Label ──────────────────────────────────────────── */
    .expr-label {
      margin-top: 20px;
      margin-bottom: 8px;
      font-size: 14px;
      color: #9d90c0;
      letter-spacing: 0.06em;
      height: 20px;
      transition: opacity 0.2s;
    }

    /* ─── Responsive ─────────────────────────────────────── */
    @media (max-width: 420px) {
      .cat-wrap svg { width: 260px; height: auto; }
      .expr-btn { width: 46px; height: 46px; font-size: 18px; border-radius: 14px; }
    }
  </style>
</head>
<body>

<p class="page-title">Cursor Cat</p>

<!--
  ╔═══════════════════════════════════════════════════════╗
  ║  SVG Cat · ViewBox 0 0 300 250                       ║
  ║                                                       ║
  ║  Layer stack (back → front):                         ║
  ║   1. White bg rect (needed for blend modes)          ║
  ║   2. Cyan rounded-square, +18° CW → left ear        ║
  ║   3. Magenta rounded-square, -18° CCW → right ear   ║
  ║      └─ mix-blend-mode: hard-light  → purple overlap ║
  ║   4. Dark navy face rect (rx=48)                     ║
  ║   5. Expression group (eyes / mouth)                 ║
  ╚═══════════════════════════════════════════════════════╝

  Color math (hard-light, src=magenta over dst=cyan):
    R: src=0.80 ≥ 0.5 → 1-2(0.20)(1.00)=0.60 → 153
    G: src=0.00 < 0.5 → 2(0.00)(0.81)=0.00 → 0
    B: src=1.00 ≥ 0.5 → 1-2(0.00)(0.00)=1.00 → 255
    Result: #9900FF — deep blue-violet ✓
-->
<div class="cat-wrap" id="catWrap">
<svg
  id="catSvg"
  viewBox="0 0 300 250"
  width="340" height="283"
  xmlns="http://www.w3.org/2000/svg"
  overflow="visible"
>
  <!-- 1 · White canvas (enables correct blend-mode compositing) -->
  <rect width="300" height="250" fill="white"/>

  <!-- 2 · Left ear: cyan rounded-square, rotated +18° CW around its center (95,90) -->
  <rect
    x="30" y="25" width="130" height="130" rx="30"
    fill="#00CCFF"
    transform="rotate(18, 95, 90)"
  />

  <!-- 3 · Right ear: magenta, rotated -18° CCW around its center (205,90)
           mix-blend-mode: hard-light  → produces purple/violet where it overlaps cyan -->
  <rect
    x="140" y="25" width="130" height="130" rx="30"
    fill="#CC00FF"
    transform="rotate(-18, 205, 90)"
    style="mix-blend-mode: hard-light"
  />

  <!-- 4 · Dark navy face — covers lower portions of both ear shapes -->
  <rect x="52" y="102" width="196" height="114" rx="50" fill="#100D68"/>

  <!-- ═══════════════════════════════════════════════
       5 · EXPRESSION GROUPS
       All coordinates live inside the face rect:
         face: x=52…248, y=102…216, center=(150,159)
       Eye positions: left cx=112, right cx=188, cy≈155
       ═══════════════════════════════════════════════ -->

  <!-- ① chat ··· (default — matches reference logo) -->
  <g id="g-chat" class="expr-g active">
    <circle class="dot-pulse-1" cx="107" cy="159" r="11.5" fill="white" transform-origin="107px 159px"/>
    <circle class="dot-pulse-2" cx="150" cy="159" r="11.5" fill="white" transform-origin="150px 159px"/>
    <circle class="dot-pulse-3" cx="193" cy="159" r="11.5" fill="white" transform-origin="193px 159px"/>
  </g>

  <!-- ② normal 👀 — two white eyes with dark pupils -->
  <g id="g-normal" class="expr-g">
    <circle cx="112" cy="155" r="16" fill="white"/>
    <circle cx="188" cy="155" r="16" fill="white"/>
    <circle cx="114" cy="157" r="7"  fill="#100D68"/>
    <circle cx="190" cy="157" r="7"  fill="#100D68"/>
    <!-- pupil highlight -->
    <circle cx="110" cy="153" r="2.5" fill="white" opacity="0.8"/>
    <circle cx="186" cy="153" r="2.5" fill="white" opacity="0.8"/>
  </g>

  <!-- ③ happy 😊 — upward arc eyes + smile -->
  <g id="g-happy" class="expr-g">
    <path d="M 97 162 Q 112 146 127 162"  stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 173 162 Q 188 146 203 162" stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 123 180 Q 150 196 177 180" stroke="white" stroke-width="4"   stroke-linecap="round" fill="none"/>
  </g>

  <!-- ④ sad 😢 — droopy eyes + frown + teardrops -->
  <g id="g-sad" class="expr-g">
    <ellipse cx="112" cy="154" rx="13" ry="11" fill="white"/>
    <ellipse cx="188" cy="154" rx="13" ry="11" fill="white"/>
    <ellipse cx="112" cy="155" rx="8"  ry="6"  fill="#100D68"/>
    <ellipse cx="188" cy="155" rx="8"  ry="6"  fill="#100D68"/>
    <!-- tears -->
    <path d="M 119 165 Q 122 172 118 178" stroke="#88d8f8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 195 165 Q 198 172 194 178" stroke="#88d8f8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- frown -->
    <path d="M 124 185 Q 150 176 176 185" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ⑤ surprised 😮 — big round eyes + open mouth -->
  <g id="g-surprised" class="expr-g">
    <circle cx="112" cy="151" r="18" fill="white"/>
    <circle cx="188" cy="151" r="18" fill="white"/>
    <circle cx="112" cy="153" r="8"  fill="#100D68"/>
    <circle cx="188" cy="153" r="8"  fill="#100D68"/>
    <circle cx="108" cy="149" r="3"  fill="white" opacity="0.7"/>
    <circle cx="184" cy="149" r="3"  fill="white" opacity="0.7"/>
    <!-- O mouth -->
    <ellipse cx="150" cy="186" rx="13" ry="10" fill="white"/>
    <ellipse cx="150" cy="186" rx="8"  ry="5.5" fill="#100D68"/>
  </g>

  <!-- ⑥ wink 😉 — left arc + right normal + smile -->
  <g id="g-wink" class="expr-g">
    <path d="M 97 157 Q 112 142 127 157" stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <circle cx="188" cy="153" r="16" fill="white"/>
    <circle cx="190" cy="155" r="7"  fill="#100D68"/>
    <circle cx="186" cy="151" r="2.5" fill="white" opacity="0.8"/>
    <path d="M 125 180 Q 150 196 175 180" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ⑦ love 😍 — heart eyes + smile (animated) -->
  <g id="g-love" class="expr-g">
    <!-- left heart -->
    <path class="heart-l"
      d="M 101 149 C 101 143, 106 140, 112 144 C 118 140, 123 143, 123 149
         C 123 155, 112 164, 112 164 C 112 164, 101 155, 101 149 Z"
      fill="#ff5ca8"/>
    <!-- right heart -->
    <path class="heart-r"
      d="M 177 149 C 177 143, 182 140, 188 144 C 194 140, 199 143, 199 149
         C 199 155, 188 164, 188 164 C 188 164, 177 155, 177 149 Z"
      fill="#ff5ca8"/>
    <path d="M 125 182 Q 150 197 175 182" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ⑧ cool 😎 — sunglasses -->
  <g id="g-cool" class="expr-g">
    <!-- lens shadow fill -->
    <rect x="90"  y="142" width="48" height="28" rx="14" fill="#0a0840"/>
    <rect x="162" y="142" width="48" height="28" rx="14" fill="#0a0840"/>
    <!-- bridge -->
    <line x1="138" y1="156" x2="162" y2="156" stroke="#0a0840" stroke-width="5"/>
    <!-- frame -->
    <rect x="90"  y="142" width="48" height="28" rx="14" fill="none" stroke="white" stroke-width="2.8"/>
    <rect x="162" y="142" width="48" height="28" rx="14" fill="none" stroke="white" stroke-width="2.8"/>
    <line x1="138" y1="156" x2="162" y2="156" stroke="white" stroke-width="2.8"/>
    <!-- lens shine -->
    <line x1="96"  y1="149" x2="108" y2="149" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
    <line x1="168" y1="149" x2="180" y2="149" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
    <!-- side arms -->
    <line x1="90"  y1="156" x2="72"  y2="154" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="210" y1="156" x2="228" y2="154" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <!-- cool smile -->
    <path d="M 126 187 Q 150 199 174 187" stroke="white" stroke-width="3.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ⑨ angry 😠 — furrowed brows + narrowed eyes + frown (with shake anim) -->
  <g id="g-angry" class="expr-g g-angry">
    <circle cx="112" cy="158" r="13" fill="white"/>
    <circle cx="188" cy="158" r="13" fill="white"/>
    <circle cx="113" cy="159" r="6"  fill="#100D68"/>
    <circle cx="189" cy="159" r="6"  fill="#100D68"/>
    <!-- angled brows (inward = angry) -->
    <line x1="97"  y1="139" x2="127" y2="147" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="203" y1="139" x2="173" y2="147" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
    <!-- upper eyelid shadow covers top of eye for squinting -->
    <path d="M 99 153 Q 112 148 125 153" fill="#100D68"/>
    <path d="M 175 153 Q 188 148 201 153" fill="#100D68"/>
    <!-- frown -->
    <path d="M 124 182 Q 150 173 176 182" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ⑩ sleepy 😴 — half-closed eyes + floating ZZZ -->
  <g id="g-sleepy" class="expr-g">
    <!-- full eye shape -->
    <ellipse cx="112" cy="157" rx="14" ry="10" fill="white"/>
    <ellipse cx="188" cy="157" rx="14" ry="10" fill="white"/>
    <!-- eyelid (top half) covering upper portion -->
    <path d="M 98 157 Q 112 147 126 157 Z" fill="#100D68"/>
    <path d="M 174 157 Q 188 147 202 157 Z" fill="#100D68"/>
    <!-- tiny pupils just peeking -->
    <ellipse cx="112" cy="160" rx="5" ry="3.5" fill="#100D68"/>
    <ellipse cx="188" cy="160" rx="5" ry="3.5" fill="#100D68"/>
    <!-- ZZZ floating upward -->
    <text class="z1" x="202" y="134" font-size="14" fill="white" font-weight="700" font-family="Arial, sans-serif">z</text>
    <text class="z2" x="212" y="120" font-size="11" fill="white" font-weight="700" font-family="Arial, sans-serif" opacity="0.7">z</text>
    <text class="z3" x="220" y="109" font-size="9"  fill="white" font-weight="700" font-family="Arial, sans-serif" opacity="0.5">z</text>
  </g>

  <!-- ⑪ laugh/cry 😂 — X eyes + big laugh + tears -->
  <g id="g-lol" class="expr-g">
    <!-- X left eye -->
    <line x1="99"  y1="143" x2="124" y2="168" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="124" y1="143" x2="99"  y2="168" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
    <!-- X right eye -->
    <line x1="175" y1="143" x2="200" y2="168" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="200" y1="143" x2="175" y2="168" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
    <!-- big grin -->
    <path d="M 118 181 Q 150 203 182 181" stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- happy cry tears -->
    <path d="M 97  172 Q 93 180 96 188"  stroke="#88d8f8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 203 172 Q 207 180 204 188" stroke="#88d8f8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ⑫ shy 🥺 — dot eyes + blush circles + awkward smile -->
  <g id="g-shy" class="expr-g">
    <circle cx="112" cy="157" r="10" fill="white"/>
    <circle cx="188" cy="157" r="10" fill="white"/>
    <!-- blush patches -->
    <ellipse cx="95"  cy="172" rx="14" ry="8" fill="#ff8ec0" opacity="0.55"/>
    <ellipse cx="205" cy="172" rx="14" ry="8" fill="#ff8ec0" opacity="0.55"/>
    <!-- awkward small smile -->
    <path d="M 132 183 Q 150 192 168 183" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

</svg>
</div>

<!-- Expression label -->
<p class="expr-label" id="exprLabel">对话模式</p>

<!-- Expression buttons -->
<div class="expr-bar" id="exprBar"></div>

<script>
// ─── Expression catalogue ──────────────────────────────────
const EXPRS = [
  { id: 'chat',      emoji: '💬', label: '对话模式'  },
  { id: 'normal',    emoji: '👀', label: '普通'      },
  { id: 'happy',     emoji: '😊', label: '开心'      },
  { id: 'sad',       emoji: '😢', label: '难过'      },
  { id: 'surprised', emoji: '😮', label: '惊讶'      },
  { id: 'wink',      emoji: '😉', label: '眨眼'      },
  { id: 'love',      emoji: '😍', label: '爱心'      },
  { id: 'cool',      emoji: '😎', label: '酷'        },
  { id: 'angry',     emoji: '😠', label: '生气'      },
  { id: 'sleepy',    emoji: '😴', label: '困'        },
  { id: 'lol',       emoji: '😂', label: '大笑'      },
  { id: 'shy',       emoji: '🥺', label: '害羞'      },
];

let current = 'chat';
const bar   = document.getElementById('exprBar');
const label = document.getElementById('exprLabel');

// Build buttons
EXPRS.forEach(e => {
  const btn = document.createElement('button');
  btn.className = 'expr-btn' + (e.id === current ? ' active' : '');
  btn.textContent = e.emoji;
  btn.title = e.label;
  btn.dataset.id = e.id;
  btn.addEventListener('click', () => switchTo(e.id, e.label));
  bar.appendChild(btn);
});

function switchTo(id, lbl) {
  if (id === current) return;

  // Hide old
  const oldG = document.getElementById('g-' + current);
  if (oldG) oldG.classList.remove('active');
  document.querySelector('.expr-btn.active')?.classList.remove('active');

  // Show new
  current = id;
  const newG = document.getElementById('g-' + id);
  if (newG) newG.classList.add('active');
  document.querySelector(`[data-id="${id}"]`)?.classList.add('active');
  label.textContent = lbl;
}

// Click the cat itself cycles through expressions
document.getElementById('catWrap').addEventListener('click', () => {
  const idx = EXPRS.findIndex(e => e.id === current);
  const next = EXPRS[(idx + 1) % EXPRS.length];
  switchTo(next.id, next.label);
});
</script>
</body>
</html>
